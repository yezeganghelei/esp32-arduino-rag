# ── ESP32 RAG knowledge base configuration ──────────────────────────
# Document paths and classification rules; edit without touching code.

# Chunking parameters
chunk_size: 1200
min_chunk: 300
batch_size: 5

# BM25 hybrid retrieval is skipped above this many chunks (memory guard).
# Raised for the large source-code corpus.
bm25_max_chunks: 300000

# ── Source-code indexing (opt-in, separate corpus / database) ───────
# Enable by setting RAG_INDEX_CODE=1 in the environment or enabled: true.
# Recommended: build into a SEPARATE ChromaDB dir so code does not affect
# the documentation retrieval ranking.
code:
  enabled: false
  extensions: [.c, .h, .cpp, .hpp, .cc, .cxx, .ino, .py, .S]
  # Directory segments excluded when scanning a code corpus (case-insensitive,
  # whole path segment; a trailing * = prefix match). Excludes third-party
  # libraries; KEEPS the examples' own code and the board `components/BSP`
  # drivers.
  exclude_dirs: [build, .git, managed_components, .venv, node_modules,
                 espressif__*, tinyusb, tinyusb_src, esp32-camera, decoder_ijg,
                 MJPEG, LVGL, led_strip]
  # Collapse identical code files (BSP drivers are copied per example).
  # false = keep every copy (all remaining example code imported).
  dedup: false
  max_file_size: 400000        # skip files larger than this many bytes
  chunk_size: 1200             # max chars per code chunk (split oversized units)
  min_chunk: 120
  weight: 2.0                  # search weight for code chunks
  # Code-like query tuning: for identifier/call/file queries, BM25 exact
  # matching beats the natural-language cross-encoder, so we blend the two.
  # ce_weight: cross-encoder share (0..1); bm25_weight: normalized BM25 share.
  ce_weight: 0.25
  bm25_weight: 1.0
  # Corpus root + DB dir for the code build and `agent.py --code`.
  #   docs_dir : point this at YOUR local code corpus. Absolute or relative
  #              (relative is resolved against the skill dir). The
  #              RAG_DOCS_DIR env var overrides it at runtime, so each machine
  #              can keep the corpus wherever it likes.
  #   chroma_dir : where the code vector DB lives (relative to skill dir).
  docs_dir: "source_code"
  chroma_dir: ".chroma_esp32_code"

# Model configuration
models:
  dense:
    default: bge-base-en-v1.5
    available:
      - name: all-MiniLM-L6-v2
        description: "Lightweight 384-dim embedding"
      - name: bge-base-en-v1.5
        description: "BAAI base 768-dim embedding"
      - name: gte-base-en-v1.5
        description: "GTE base 768-dim embedding"
      - name: embeddinggemma-300m-npu
        description: "Google Gemma 300M NPU-optimized"
  cross_encoder:
    default: cross-encoder-ms-marco-MiniLM-L-6-v2
    available:
      - name: cross-encoder-ms-marco-MiniLM-L-6-v2
        description: "MS MARCO cross-encoder reranker"

# SoC name -> datasheet number mapping (used for comparison queries)
soc_to_datasheet:
  esp32-s3: "DS-11199"
  esp32: "DS-10119"
  esp32-c3: "DS-11676"
  esp32-c6: "DS-11205"
  esp32-h2: "DS-11562"
  esp32-s2: "DS-11561"

# Document classification rules: subpath keyword -> document type
# Order matters; the first matching rule from the top wins
doc_type_rules:
  - contains: api_reference
    type: api_reference
  - contains: datasheet
    type: datasheet
  - contains: guide
    type: guide
  - contains: trm
    type: trm
  - contains: technical_reference
    type: trm
  - contains: safety
    type: safety
  - contains: release
    type: release_notes
  - contains: license
    type: docs
  - contains: reference
    type: docs
  - contains: spec
    type: specification
  - type: docs                         # fallback type

# Document weight rules: subpath keyword -> weight value
weight_rules:
  - contains: api_reference
    weight: 3.0
  - contains: guide
    weight: 3.0
  - contains: docs
    weight: 2.0
  - contains: trm
    weight: 2.0
  - contains: technical_reference
    weight: 2.0
  - contains: datasheet
    weight: 1.0
  - weight: 1.0                        # fallback weight

# Document type -> ChromaDB collection name mapping
collection_map:
  datasheet: datasheet_chunks
  trm: trm_chunks
  guide: guide_chunks
  api_reference: api_chunks
  safety: safety_chunks
  release_notes: release_chunks
  specification: spec_chunks
  code: code_chunks
  docs: docs_chunks

# Query synonym expansion (query expansion)
query_expansions:
  flash: [bind, flash, flashing]
  flashing: [bind, flash, flashing]
  install: [install, installation, setup, getting_started]
  installation: [install, installation, setup, getting_started]
  setup: [install, installation, setup, configuration]
  config: [configuration, config]
  configure: [configuration, config]
  spec: [specification, spec, specs, datasheet]
  specs: [specification, spec, specs, datasheet]
  datasheet: [datasheet, specification, spec, specs, data sheet]
  specification: [specification, spec, specs, datasheet, data sheet]
  req: [requirement, requirements, req]
  reqs: [requirement, requirements, req]
  troubleshoot: [troubleshooting, troubleshoot, error, debug]
  debug: [debug, troubleshooting, trace]
  api: [api, api_reference, reference]
  gpu: [gpu, graphics]
  cpu: [cpu]
  sdk: [sdk, software_development_kit]
  trm: [trm, technical_reference_manual]
  soc: [soc, system_on_chip]
  mcu: [mcu, microcontroller_unit]
  errata: [errata, known_issues, bugs]
  safety: [safety, functional_safety, iso26262]
  security: [security, cybersecurity, secure]
  boot: [boot, bootloader, startup]
  errcode: [errcode, err_code, error_code, error code, error id]

# SoC spec table feature keywords (used to identify the SoC feature table in a datasheet)
spec_feature_keywords:
  - cpu
  - memory
  - display
  - video
  - pcie
  - usb
  - ethernet
  - camera
  - isp
  - boot
  - security
  - functional safety
  - real-time
  - dmips
  - cache
  - l1
  - l2
  - l3
  - arm cortex
