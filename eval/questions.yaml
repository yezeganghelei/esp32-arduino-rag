# ═══════════════════════════════════════════════════════════════════════
# ESP32 RAG 评测题库（模板）
# ═══════════════════════════════════════════════════════════════════════
# 用途：对比「裸大模型」vs「本项目 RAG」在“硬事实”问题上的准确率/可引用性。
#
# 字段：
#   id         唯一标识
#   category   分类（pin_count / cpu / memory / wireless / peripheral /
#              variant / boot / register / errata）
#   question   用户问题
#   expected   标准答案（裁判用它判断对错；请务必对照你的语料核对/完善）
#   keywords   关键词匹配用（做裁判失败时的兜底；取值应为答案中必须出现的核心 token）
#   source_hint 期望命中的文档/来源（用于人工核对）
#   verify     可选 true = 该条建议你对照语料再确认一次
#
# 说明：expected 是“事实基准”，不是强制唯一表述。裁判只看事实是否一致。
# 建议你按自己的语料补充/修正，并持续增加“变体差异 / errata / 寄存器”类问题。
# ═══════════════════════════════════════════════════════════════════════

# ── 引脚/GPIO 数量 ──────────────────────────────────────────────────
- id: gpio_s3
  category: pin_count
  question: ESP32-S3 一共有多少个 GPIO 引脚？
  expected: "45 个 GPIO"
  keywords: ["45"]
  source_hint: esp32-s3_datasheet / esp32-s3 TRM

- id: gpio_esp32
  category: pin_count
  question: 经典 ESP32 一共有多少个 GPIO 引脚？
  expected: "34 个 GPIO"
  keywords: ["34"]
  source_hint: esp32 datasheet
  verify: true

- id: gpio_c3
  category: pin_count
  question: ESP32-C3 一共有多少个 GPIO 引脚？
  expected: "22 个 GPIO"
  keywords: ["22"]
  source_hint: esp32-c3 datasheet
  verify: true

# ── CPU ────────────────────────────────────────────────────────────
- id: cpu_s3
  category: cpu
  question: ESP32-S3 使用什么 CPU 内核，最高主频是多少？
  expected: "Xtensa LX7 双核，最高 240 MHz"
  keywords: ["LX7", "240"]
  source_hint: esp32-s3 datasheet

- id: cpu_esp32
  category: cpu
  question: 经典 ESP32 使用什么 CPU 内核，最高主频是多少？
  expected: "Xtensa LX6 双核，最高 240 MHz"
  keywords: ["LX6", "240"]
  source_hint: esp32 datasheet

- id: cpu_riscv
  category: cpu
  question: ESP32-C3 使用的是哪种指令集架构的 CPU？
  expected: "RISC-V 单核"
  keywords: ["RISC-V"]
  source_hint: esp32-c3 datasheet

# ── 内存 ───────────────────────────────────────────────────────────
- id: sram_s3
  category: memory
  question: ESP32-S3 的片上 SRAM 容量是多少？
  expected: "512 KB"
  keywords: ["512"]
  source_hint: esp32-s3 datasheet

- id: sram_esp32
  category: memory
  question: 经典 ESP32 的片上 SRAM 容量是多少？
  expected: "520 KB"
  keywords: ["520"]
  source_hint: esp32 datasheet

- id: rom_s3
  category: memory
  question: ESP32-S3 的片上 ROM 容量是多少？
  expected: "384 KB"
  keywords: ["384"]
  source_hint: esp32-s3 datasheet

# ── 无线 ───────────────────────────────────────────────────────────
- id: bt_s3
  category: wireless
  question: ESP32-S3 支持经典蓝牙（Bluetooth Classic / BR-EDR）吗？
  expected: "不支持；仅支持 Bluetooth LE（BLE 5）"
  keywords: ["不支持", "BLE"]
  source_hint: esp32-s3 datasheet

- id: bt_esp32
  category: wireless
  question: 经典 ESP32 支持哪些蓝牙类型？
  expected: "经典蓝牙（BR/EDR）和 Bluetooth LE（BLE）"
  keywords: ["经典蓝牙", "BLE"]
  source_hint: esp32 datasheet

- id: wifi_c6
  category: wireless
  question: ESP32-C6 支持哪一代 Wi-Fi 标准？
  expected: "Wi-Fi 6（802.11ax）"
  keywords: ["Wi-Fi 6"]
  source_hint: esp32-c6 datasheet
  verify: true

- id: wifi_esp32
  category: wireless
  question: 经典 ESP32 支持哪种 Wi-Fi 标准，工作在哪个频段？
  expected: "IEEE 802.11 b/g/n，2.4 GHz"
  keywords: ["802.11", "2.4"]
  source_hint: esp32 datasheet

