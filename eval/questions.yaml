# ── 启动 / 变体差异 ─────────────────────────────────────────────────
- id: boot_s3
  category: boot
  question: ESP32-S3 有哪几种启动模式？
  expected: "SPI Boot、Joint Download Boot、SPI Download Boot"
  keywords: ["SPI Boot", "Download Boot"]
  source_hint: esp32-s3 datasheet / TRM 芯片启动控制

- id: variant_bt
  category: variant
  question: ESP32 与 ESP32-S3 在蓝牙支持上的主要区别是什么？
  expected: "经典 ESP32 支持经典蓝牙+BLE；ESP32-S3 仅支持 BLE（不支持经典蓝牙）"
  keywords: ["经典蓝牙", "BLE"]
  source_hint: esp32 datasheet vs esp32-s3 datasheet

