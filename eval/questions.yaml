# ═══════════════════════════════════════════════════════════════════════
# 硬题 2：语料实取 —— 芯片勘误(errata) + datasheet 细节
# 来源：esp-chip-errata-en-master-esp32s3.pdf（ESP32-S3 Series SoC Errata v1.3）
#       与 esp32-s3_datasheet_en.pdf。这些是大模型大概率答不准的点。
# ═══════════════════════════════════════════════════════════════════════

# ── 勘误：文档版本 / 条目 ──────────────────────────────────────────
- id: errata_version
  category: errata
  question: ESP32-S3 系列 SoC 勘误文档（ESP32-S3 Series SoC Errata）当前版本号是多少？
  expected: "v1.3（2025-03-31）"
  keywords: ["v1.3"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf
  verify: true

- id: errata_count
  category: errata
  question: ESP32-S3 SoC Errata v1.3 的勘误汇总表一共列出多少条 errata？
  expected: "8 条"
  keywords: ["8"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf 汇总表
  verify: true

- id: errata_cache126
  category: errata
  question: ESP32-S3 的 [CACHE-126] 描述的是什么问题？
  expected: "Cache Hit Error During Cache Write-Backs（缓存回写过程中的缓存命中错误）"
  keywords: ["Cache", "Write-Back"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf 3.1
  verify: true

- id: errata_rtc126
  category: errata
  question: ESP32-S3 的 [RTC-126] 描述的是什么问题？
  expected: "从 light-sleep 唤醒后读取 RTC 寄存器出错"
  keywords: ["light-sleep", "RTC"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf 3.2
  verify: true

- id: errata_analog160
  category: errata
  question: ESP32-S3 的 [ANALOG-160] 在什么条件下会损坏芯片？
  expected: "当 BIAS_SLEEP = 0 且 PD_CUR = 1 时芯片会被损坏"
  keywords: ["BIAS_SLEEP", "PD_CUR"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf 3.3
  verify: true

- id: errata_lcd239
  category: errata
  question: ESP32-S3 的 [LCD-239] 描述的是什么问题？
  expected: "使用某些时钟分频时，LCD 模块行为不可靠"
  keywords: ["LCD", "时钟分频"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf 3.4
  verify: true

- id: errata_usbotg4289
  category: errata
  question: ESP32-S3 的 [USBOTG-4289] 描述的是什么问题？
  expected: "USB-OTG 下载功能不可用（The USB-OTG Download Function Is Unavailable）"
  keywords: ["USB-OTG", "Download"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf 3.5
  verify: true

- id: errata_rmt176
  category: errata
  question: ESP32-S3 的 [RMT-176] 描述的是什么问题？
  expected: "RMT 连续发送模式下空闲状态信号电平可能出错"
  keywords: ["RMT", "Idle"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf 3.6
  verify: true

- id: errata_touch100_wa
  category: errata
  question: ESP32-S3 的 [TOUCH-100] 建议的规避（workaround）方法是什么？
  expected: "跳过前两次 TOUCH_SCAN_DONE_INT 中断，然后关闭并停止使用它们；官方无修复计划"
  keywords: ["TOUCH_SCAN_DONE_INT", "跳过"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf 3.7
  verify: true

- id: errata_adc183
  category: errata
  question: ESP32-S3 的 [ADC-183] 描述的问题和建议的规避方法是什么？
  expected: "SAR ADC2 的数字控制器(DMA)可能收到错误的采样使能信号而失效；建议改用 RTC 控制器控制 SAR ADC2"
  keywords: ["ADC2", "RTC"]
  source_hint: esp-chip-errata-en-master-esp32s3.pdf 3.8
  verify: true

# ── datasheet 细节 ─────────────────────────────────────────────────
- id: dsheet_flash_freq
  category: memory
  question: ESP32-S3 片上 SPI flash 默认最高工作时钟频率是多少？是否支持 auto suspend？
  expected: "默认最高 80 MHz，且不支持 auto suspend（如需 120 MHz 或 auto suspend 需联系乐鑫）"
  keywords: ["80", "auto suspend"]
  source_hint: esp32-s3 datasheet Nomenclature 注释
  verify: true

- id: dsheet_psram_ecc
  category: memory
  question: 对带 Octal SPI PSRAM 的 ESP32-S3（如 ESP32-S3R8），启用 PSRAM ECC 后会带来什么影响？
  expected: "最高环境温度可提升到 85 °C，但可用 PSRAM 容量减少 1/16"
  keywords: ["85", "1/16"]
  source_hint: esp32-s3 datasheet Nomenclature 注释
  verify: true

- id: dsheet_pwr_pins
  category: peripheral
  question: ESP32-S3 有几个输入电源引脚，分别是什么？
  expected: "6 个输入电源引脚：VDDA1、VDDA2、VDD3P3×2、VDD3P3_RTC、VDD3P3_CPU（另有 VDD_SPI 为输入/输出电源引脚）"
  keywords: ["VDDA1", "VDD3P3_RTC", "VDD3P3_CPU"]
  source_hint: esp32-s3 datasheet Power Scheme
  verify: true

- id: dsheet_ble_phy
  category: wireless
  question: ESP32-S3 的 Bluetooth LE PHY 支持哪些速率（含 Coded PHY）？
  expected: "1 Mbps、2 Mbps，以及 Coded PHY（125 Kbps 和 500 Kbps）"
  keywords: ["1 Mbps", "2 Mbps", "500"]
  source_hint: esp32-s3 datasheet Bluetooth LE PHY
  verify: true

- id: dsheet_wifi_ifaces
  category: wireless
  question: ESP32-S3 的 Wi-Fi MAC 支持几个虚拟 Wi-Fi 接口？
  expected: "4 个（Four virtual Wi-Fi interfaces）"
  keywords: ["4"]
  source_hint: esp32-s3 datasheet Wi-Fi MAC
  verify: true
